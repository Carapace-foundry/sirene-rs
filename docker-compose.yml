version: '3.8'

services:
  sirene:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/carapace-foundry/sirene-rs:latest
    container_name: sirene-rs
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Mount your host index directory or file into the container
      - ./data:/data:ro
    environment:
      - RUST_LOG=info
    command: ["serve", "--index", "/data/sirene.idx", "--host", "0.0.0.0", "--port", "8080"]
